name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null

      # Dependencies are checked against gradle/verification-metadata.xml and the lockfiles (S11).
      - name: Build release APK, test APKs and the S1 canary
        run: ./gradlew assembleRelease assembleDebug assembleDebugAndroidTest :tools:permission-canary:assembleRelease --console=plain

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest :core:test :app:lintDebug :jobs:lintDebug :engine-image:lintDebug :engine-pdf:lintDebug --console=plain

      - name: S11 vulnerability scan (OSV) of everything in the lockfiles
        run: python3 scripts/osv_scan.py

      - name: Manifest checks S1, S2, S3, S9 on the release APK
        run: python3 scripts/check_manifest.py app/build/outputs/apk/release/app-release-unsigned.apk --allow-exported scripts/exported-allowlist.txt

      - name: S1 self-test (the check must reject an APK with INTERNET)
        run: |
          set +e
          out=$(python3 scripts/check_manifest.py tools/permission-canary/build/outputs/apk/release/permission-canary-release-unsigned.apk --allow-exported scripts/exported-allowlist.txt)
          status=$?
          echo "$out"
          if [ $status -eq 0 ] || ! grep -q "S1: network permission android.permission.INTERNET" <<< "$out"; then
            echo "The S1 check let a network permission through"
            exit 1
          fi

  secrets:
    # S16: no signing material or secrets in the public repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
